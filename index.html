<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hector Borges | Cybersecurity Portfolio</title>
  <meta name="description" content="Cybersecurity professional and strategist with 14+ years of experience in operations, planning, and consulting.">
  <link rel="icon" type="image/jpeg" href="/assets/Profile.jpg" />
  <style>
    :root {
      --accent: #007bff;
      --bg-color: #0d0d0d;
      --text-color: #f5f5f5;
      --font-family: "Inter", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #000;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      color: var(--text-color);
      text-decoration: none;
      margin: 0 1rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--accent);
    }

    main {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      margin: 4rem auto;
      padding: 1rem;
      gap: 2rem;
    }

    .profile-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
    }

    .content {
      max-width: 500px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .resume-btn {
      background-color: var(--accent);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .resume-btn:hover {
      background-color: #339aff;
    }

    footer {
      text-align: center;
      padding: 1rem 0;
      color: #aaa;
      border-top: 1px solid #222;
      margin-top: 3rem;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }

      .profile-img {
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="resume.html">Resume</a>
    <a href="documents.html">Documents</a>
    <a href="research.html">Research</a>
    <a href="media.html">Media (Web Sites)</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <img src="assets/Profile.jpg" alt="Hector Borges Professional Portrait" class="profile-img" />
    <div class="content">
      <h1>Hector Borges</h1>
      <p>Cybersecurity Graduate Student | Military Operations Strategist | Consultant</p>
      <a href="assets/Hector Borges.pdf" class="resume-btn" target="_blank" download>Download Resume</a>
    </div>
  </main>

  <footer>
    <p>© 2025 Hector Borges. All rights reserved.</p>
  </footer>

</body>
</html>
