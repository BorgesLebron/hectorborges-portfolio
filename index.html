<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hector Borges | Cybersecurity Portfolio</title>
  <meta name="description" content="Cybersecurity professional and strategist with 14+ years of experience in operations, planning, and consulting.">
  <link rel="icon" type="image/jpeg" href="/assets/Profile.jpg">
  <style>
    :root {
      --accent: #007bff;
      --bg-color: #0d0d0d;
      --text-color: #f5f5f5;
      --font-family: "Inter", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 2rem 1rem;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      margin-top: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-top: 1rem;
    }

    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0.75rem auto 2rem;
      line-height: 1.5;
    }

    .resume-btn {
      background-color: var(--accent);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .resume-btn:hover {
      background-color: #339aff;
    }

    footer {
      margin-top: 4rem;
      padding: 1rem 0;
      font-size: 0.9rem;
      color: #aaa;
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

  <header>
    <img src="/assets/Profile.jpg" alt="Hector Borges Professional Portrait" class="profile-img">
    <h1>Hector Borges</h1>
    <p>Cybersecurity Graduate Student | Military Operations Strategist | Consultant</p>
    <a href="/assets/Hector Borges.pdf" class="resume-btn" target="_blank" download>Download Resume</a>
  </header>

  <footer>
    <p>© 2025 Hector Borges. All rights reserved.</p>
  </footer>

</body>
</html>
