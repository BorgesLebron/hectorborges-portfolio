<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hector Borges | Contact</title>
    <meta name="description" content="Contact Hector Borges for cybersecurity inquiries, collaborations, or professional opportunities.">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Contact Me</h1>
        <p>I'm always open to discussing cybersecurity, research, collaboration opportunities, or general inquiries. Please feel free to reach out!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="resume.html">Resume</a>
        <a href="documents.html">Documents</a>
        <a href="research.html">Research</a>
        <a href="media.html">Media</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <main class="main-content">
        <form class="contact-form" action="https://formspree.io/f/xnnlloyd" method="POST">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="_replyto" required> <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <input type="submit" value="Send Message">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="current-year-footer"></span> Hector Borges. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById('current-year-footer').textContent = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('nav a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                } else if (currentPath === '' && link.getAttribute('href') === 'index.html') {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
